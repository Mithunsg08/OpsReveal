<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpsReveal - Verify Email</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen text-slate-100 bg-slate-950 flex flex-col justify-center items-center px-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl text-center space-y-6">
    
    <div class="h-16 w-16 bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 rounded-2xl mx-auto flex items-center justify-center">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
    </div>

    <div>
      <h2 class="text-2xl font-bold text-white font-heading">Verify your email</h2>
      <p class="text-xs text-slate-400 mt-2">We sent a verification link to your email address. Please open your inbox and click the link to activate your account.</p>
    </div>

    <!-- Feedback Banner -->
    <div id="statusMessage" class="hidden p-3 rounded-xl text-xs font-semibold"></div>

    <div class="space-y-3">
      <!-- Check Verification Status Button -->
      <button id="checkStatusBtn" class="w-full py-3 px-4 rounded-xl font-bold text-xs text-slate-950 bg-cyan-400 hover:bg-cyan-300 transition font-heading uppercase tracking-wider">
        I've Verified My Email
      </button>

      <!-- Resend Verification Email Button -->
      <button id="resendBtn" class="w-full py-2.5 px-4 rounded-xl font-semibold text-xs text-slate-400 hover:text-white bg-slate-950 border border-slate-800 hover:bg-slate-800 transition">
        Resend Email Link
      </button>
    </div>

    <p class="text-xs text-slate-500">
      Need to use a different account? 
      <a href="/login.html" class="text-cyan-400 hover:underline">Return to Login</a>
    </p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANvecmxTQfsum_1NThmFFVELCe3dlNm6g",
      authDomain: "opsreveal.firebaseapp.com",
      projectId: "opsreveal",
      storageBucket: "opsreveal.firebasestorage.app",
      messagingSenderId: "890870101711",
      appId: "1:890870101711:web:4266246996091ea56c69ba"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const checkStatusBtn = document.getElementById('checkStatusBtn');
    const resendBtn = document.getElementById('resendBtn');
    const statusMessage = document.getElementById('statusMessage');

    function showStatus(text, isError = false) {
      statusMessage.textContent = text;
      statusMessage.className = `p-3 rounded-xl text-xs font-semibold ${
        isError ? 'bg-red-950/80 text-red-300 border border-red-800' : 'bg-emerald-950/80 text-emerald-300 border border-emerald-800'
      }`;
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = '/login.html';
      } else if (user.emailVerified) {
        window.location.href = '/dashboard.html';
      }
    });

    // Check Live Verification State
    checkStatusBtn.addEventListener('click', async () => {
      if (!auth.currentUser) return;
      
      await auth.currentUser.reload();
      
      if (auth.currentUser.emailVerified) {
        showStatus("Email verified! Redirecting to dashboard...");
        setTimeout(() => { window.location.href = '/dashboard.html'; }, 1000);
      } else {
        showStatus("Email not verified yet. Please check your inbox or spam folder.", true);
      }
    });

    // Resend Link
    resendBtn.addEventListener('click', async () => {
      try {
        if (auth.currentUser) {
          await sendEmailVerification(auth.currentUser);
          showStatus("A new verification link has been sent to your email!");
        }
      } catch (err) {
        showStatus(err.message.replace('Firebase: ', ''), true);
      }
    });
  </script>
</body>
</html>
