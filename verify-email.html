<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email - OpsReveal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center space-y-6">
    <div class="w-16 h-16 bg-sky-500/10 border border-sky-500/30 text-sky-400 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold">
      ✉️
    </div>

    <div class="space-y-2">
      <h1 class="text-2xl font-bold text-white">Verify Your Email</h1>
      <p class="text-sm text-slate-400">We've sent a verification link to your email address. Please open your inbox and click the link to activate your access.</p>
    </div>

    <div class="pt-4 space-y-3">
      <button id="checkStatusBtn" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-xl py-3 transition">
        I've Verified My Email
      </button>
      <button id="resendBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl py-3 transition text-sm">
        Resend Verification Email
      </button>
    </div>

    <div id="statusMsg" class="text-xs font-mono text-amber-400 hidden"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANvecmxTQfsum_1NThmFFVELCe3dlNm6g",
      authDomain: "opsreveal.firebaseapp.com",
      projectId: "opsreveal",
      storageBucket: "opsreveal.firebasestorage.app",
      messagingSenderId: "890870101711",
      appId: "1:890870101711:web:4266246996091ea56c69ba"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const checkBtn = document.getElementById('checkStatusBtn');
    const resendBtn = document.getElementById('resendBtn');
    const statusMsg = document.getElementById('statusMsg');

    checkBtn.addEventListener('click', async () => {
      if (auth.currentUser) {
        await auth.currentUser.reload(); // Refresh token state
        if (auth.currentUser.emailVerified) {
          window.location.href = "/upload.html"; // Open tool
        } else {
          statusMsg.textContent = "Email is not verified yet. Please check your inbox or spam folder.";
          statusMsg.classList.remove('hidden');
        }
      }
    });

    resendBtn.addEventListener('click', async () => {
      if (auth.currentUser) {
        await sendEmailVerification(auth.currentUser);
        statusMsg.textContent = "A new verification link has been sent!";
        statusMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
