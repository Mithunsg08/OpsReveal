<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpsReveal | Settings</title>
  <!-- Step A: Instant Script Guard before DOM loads -->
  <script type="module">
    import { auth } from '/app/auth-guard.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    onAuthStateChanged(auth, (user) => {
      if (!user || !user.emailVerified) {
        // Stop execution and force redirect immediately
        window.location.replace('/login.html');
      } else {
        // Only unhide the app content if verified user exists
        document.body.style.display = 'block';
      }
    });
  </script>
</head>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex antialiased">

  <aside class="w-64 border-r border-slate-800 bg-slate-950 p-6 flex flex-col justify-between shrink-0">
    <div class="space-y-8">
      <div class="flex items-center space-x-3">
        <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-black text-slate-950">O</div>
        <div><h1 class="font-bold text-white text-base">OpsReveal</h1><span class="text-[10px] text-slate-500">Prevent Capital Loss</span></div>
      </div>
      <nav class="space-y-1.5 text-sm font-medium">
        <a href="/app/dashboard" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-900">Dashboard</a>
        <a href="/app/uploads" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-900">Upload Reports</a>
        <a href="/app/settings" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl bg-slate-900 text-white">Settings</a>
      </nav>
    </div>
  </aside>

  <main class="flex-1 p-8 space-y-6 max-w-3xl mx-auto">
    <h2 class="text-2xl font-bold text-white">Account Settings</h2>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6">
      <h3 class="font-bold text-white border-b border-slate-800 pb-2">Profile Info</h3>
      <div class="grid grid-cols-2 gap-4 text-xs">
        <div><label class="block mb-1">Name</label><input type="text" value="Manager" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white"></div>
        <div><label class="block mb-1">Email ID</label><input type="email" value="user@preventloss.org" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white"></div>
        <div><label class="block mb-1">Country (Optional)</label><input type="text" placeholder="India" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white"></div>
        <div><label class="block mb-1">Usage</label><input type="text" disabled value="1 / 4 Uploads Used" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-slate-500"></div>
      </div>

      <h3 class="font-bold text-white border-b border-slate-800 pb-2">Security</h3>
      <div class="space-y-3 text-xs max-w-sm">
        <input type="password" placeholder="Current Password" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white">
        <input type="password" placeholder="New Password" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white">
        <button onclick="alert('Password updated!')" class="bg-slate-800 p-2 rounded text-white font-semibold">Change Password</button>
      </div>

      <h3 class="font-bold text-white border-b border-slate-800 pb-2">Upgrade</h3>
      <div class="flex justify-between items-center bg-slate-950 p-4 rounded-xl border border-slate-800">
        <div>
          <span class="block text-sm font-bold text-white">Professional Plan ($99/mo)</span>
          <span class="text-xs text-slate-400">Unlimited uploads and full analysis</span>
        </div>
        <button onclick="upgrade()" class="bg-cyan-500 text-slate-950 font-bold px-4 py-2 rounded text-xs">Upgrade</button>
      </div>
    </div>
  </main>

  <script>
    function upgrade() {
      localStorage.setItem('opsreveal_plan', 'Professional');
      alert('Upgraded to Professional Plan!');
    }
  </script>
</body>
</html>
