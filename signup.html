<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpsReveal | Create Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="h-12 w-12 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-black text-slate-950 text-xl mx-auto">O</div>
      <h1 class="text-2xl font-bold text-white">Create OpsReveal Account</h1>
      <p class="text-xs text-slate-400">Operational Intelligence Platform</p>
    </div>

    <!-- Error/Status Box -->
    <div id="error-box" class="hidden p-4 rounded-xl text-xs font-semibold bg-rose-950/80 border border-rose-800 text-rose-300"></div>

    <form id="signup-form" onsubmit="handleEmailSignup(event)" class="space-y-4 text-xs">
      <div>
        <label class="block mb-1 font-medium text-slate-300">Full Name</label>
        <input type="text" id="fullName" required placeholder="John Doe" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block mb-1 font-medium text-slate-300">Company Name</label>
          <input type="text" id="companyName" required placeholder="Acme Inc." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
        </div>

        <div>
          <label class="block mb-1 font-medium text-slate-300">Role</label>
          <select id="role" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
            <option value="Owner">Owner</option>
            <option value="Founder">Founder</option>
            <option value="CEO">CEO</option>
            <option value="COO">COO</option>
            <option value="Operations Manager">Operations Manager</option>
            <option value="Procurement Manager">Procurement Manager</option>
            <option value="Finance Manager">Finance Manager</option>
            <option value="Warehouse Manager">Warehouse Manager</option>
            <option value="Analyst">Analyst</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block mb-1 font-medium text-slate-300">Company Domain <span class="text-slate-500">(Optional)</span></label>
        <input type="text" id="domain" placeholder="acme.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
      </div>

      <div>
        <label class="block mb-1 font-medium text-slate-300">Work Email</label>
        <input type="email" id="email" required placeholder="name@company.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block mb-1 font-medium text-slate-300">Password</label>
          <div class="relative">
            <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 pr-10 text-white focus:outline-none focus:border-cyan-500">
            <button type="button" onclick="toggleVisibility('password', 'eye-pass')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
              <span id="eye-pass">👁️</span>
            </button>
          </div>
        </div>

        <div>
          <label class="block mb-1 font-medium text-slate-300">Confirm Password</label>
          <div class="relative">
            <input type="password" id="confirmPassword" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 pr-10 text-white focus:outline-none focus:border-cyan-500">
            <button type="button" onclick="toggleVisibility('confirmPassword', 'eye-confirm')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
              <span id="eye-confirm">👁️</span>
            </button>
          </div>
        </div>
      </div>
      
      <button type="submit" id="btn-signup" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 rounded-xl transition mt-2">
        Create Account
      </button>
    </form>

    <div class="relative flex items-center justify-center my-4">
      <div class="border-t border-slate-800 w-full"></div>
      <span class="bg-slate-900 px-3 text-[10px] text-slate-500 uppercase font-semibold absolute">Or continue with</span>
    </div>

    <button onclick="handleGoogleSignup()" class="w-full bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 font-semibold py-3 rounded-xl text-xs flex items-center justify-center space-x-2 transition">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <p class="text-center text-xs text-slate-400 pt-2">
      Already have an account? <a href="/login.html" class="text-cyan-400 font-semibold hover:underline">Login</a>
    </p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      sendEmailVerification, 
      GoogleAuthProvider, 
      signInWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANvecmxTQfsum_1NThmFFVELCe3dlNm6g",
      authDomain: "opsreveal.firebaseapp.com",
      projectId: "opsreveal",
      storageBucket: "opsreveal.firebasestorage.app",
      messagingSenderId: "890870101711",
      appId: "1:890870101711:web:4266246996091ea56c69ba",
      measurementId: "G-LCWJSW9SKY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Password Toggle Helper
    window.toggleVisibility = (inputId, eyeId) => {
      const input = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      if (input.type === 'password') {
        input.type = 'text';
        eye.innerText = '🙈';
      } else {
        input.type = 'password';
        eye.innerText = '👁️';
      }
    };

    // Helper: Create Firestore documents
    async function createCompanyRecord({ companyName, domain, ownerUid, ownerEmail, fullName, role }) {
      const companyRef = doc(db, "companies", ownerUid);
      const userRef = doc(db, "users", ownerUid);

      await setDoc(companyRef, {
        companyName,
        domain: domain || "",
        ownerUid,
        createdAt: serverTimestamp()
      });

      await setDoc(userRef, {
        uid: ownerUid,
        fullName,
        email: ownerEmail,
        role,
        companyId: ownerUid,
        onboardingCompleted: true,
        createdAt: serverTimestamp()
      });
    }

    // Email/Password Signup
    window.handleEmailSignup = async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value;
      const companyName = document.getElementById('companyName').value;
      const role = document.getElementById('role').value;
      const domain = document.getElementById('domain').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('btn-signup');

      if (password !== confirmPassword) {
        showError("Passwords do not match.");
        return;
      }

      try {
        btn.disabled = true;
        btn.innerText = "Creating account...";
        hideError();

        // 1. Create User
        const result = await createUserWithEmailAndPassword(auth, email, password);

        // 2. Send Verification Email
        await sendEmailVerification(result.user, {
          url: `${window.location.origin}/login.html`
        });

        // 3. Create Documents in Firestore
        await createCompanyRecord({
          companyName,
          domain,
          ownerUid: result.user.uid,
          ownerEmail: email,
          fullName,
          role
        });

        // 4. Redirect to Login
        window.location.href = '/login.html';
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Create Account";
      }
    };

    // Google Signup
    window.handleGoogleSignup = async () => {
      try {
        hideError();
        const provider = new GoogleAuthProvider();
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        const userRef = doc(db, "users", user.uid);
        const existingUser = await getDoc(userRef);

        if (!existingUser.exists()) {
          let companyName = document.getElementById('companyName').value;

          if (!companyName) {
            companyName = prompt("Enter Company Name") || "";
          }

          if (!companyName) {
            showError("Company name is required to complete registration.");
            return;
          }

          const role = document.getElementById('role').value || "Owner";
          const domain = document.getElementById('domain').value || "";

          await createCompanyRecord({
            companyName,
            domain,
            ownerUid: user.uid,
            ownerEmail: user.email || "",
            fullName: user.displayName || "",
            role
          });
        }

        window.location.href = '/app/dashboard.html';
      } catch (err) {
        showError(err.message);
      }
    };

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.innerText = msg;
      box.classList.remove('hidden');
    }

    function hideError() {
      const box = document.getElementById('error-box');
      box.classList.add('hidden');
    }
  </script>
</body>
</html>
