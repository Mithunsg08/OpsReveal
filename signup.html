<!-- Firebase Auth Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      sendEmailVerification,
      GoogleAuthProvider, 
      signInWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANvecmxTQfsum_1NThmFFVELCe3dlNm6g",
      authDomain: "opsreveal.firebaseapp.com",
      projectId: "opsreveal",
      storageBucket: "opsreveal.firebasestorage.app",
      messagingSenderId: "890870101711",
      appId: "1:890870101711:web:4266246996091ea56c69ba"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const SUPER_ADMIN_EMAIL = "mithun@preventloss.org";

    // --- Check for Invitation Parameters ---
    const urlParams = new URLSearchParams(window.location.search);
    const invitedBy = urlParams.get('invitedBy');
    const invitedEmail = urlParams.get('email');

    const emailInput = document.getElementById('email');
    const signupForm = document.getElementById('signupForm');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const googleAuthBtn = document.getElementById('googleAuthBtn');
    const errorBanner = document.getElementById('errorBanner');
    const errorMessage = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    // Auto-fill and lock email if arriving via invitation link
    if (invitedEmail) {
      emailInput.value = invitedEmail;
      emailInput.readOnly = true;
      emailInput.classList.add('opacity-75', 'cursor-not-allowed');
    }

    // Password Visibility Toggle Logic
    document.getElementById('togglePasswordBtn').addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
    });

    document.getElementById('toggleConfirmPasswordBtn').addEventListener('click', () => {
      const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      confirmPasswordInput.setAttribute('type', type);
    });

    // Real-Time Password Condition Validation
    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      
      const isLength = val.length >= 8;
      document.getElementById('condLength').className = `flex items-center space-x-1.5 ${isLength ? 'text-emerald-400 font-semibold' : 'text-slate-500'}`;

      const isUpper = /[A-Z]/.test(val);
      document.getElementById('condUpper').className = `flex items-center space-x-1.5 ${isUpper ? 'text-emerald-400 font-semibold' : 'text-slate-500'}`;

      const isNumOrSpec = /[\d\W]/.test(val);
      document.getElementById('condNumber').className = `flex items-center space-x-1.5 ${isNumOrSpec ? 'text-emerald-400 font-semibold' : 'text-slate-500'}`;
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorBanner.classList.remove('hidden');
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      btnText.classList.toggle('hidden', isLoading);
      btnSpinner.classList.toggle('hidden', !isLoading);
    }

    // Safely Provision User Profile + Workspace with fallback handling
    async function syncMinimalUserProfile(user) {
      try {
        const isAdmin = user.email && user.email.toLowerCase() === SUPER_ADMIN_EMAIL.toLowerCase();

        // 1. If invited, attach to owner's companyId; otherwise create own workspace
        const targetCompanyId = invitedBy ? invitedBy : user.uid;
        const userRole = isAdmin ? "SuperAdmin" : (invitedBy ? "Collaborator" : "Owner");

        if (!invitedBy) {
          const companyRef = doc(db, "companies", user.uid);
          await setDoc(companyRef, {
            companyName: isAdmin ? "OpsReveal Admin Workspace" : `${user.displayName || 'User'}'s Workspace`,
            domain: "",
            ownerUid: user.uid,
            createdAt: serverTimestamp()
          }, { merge: true });
        }

        // 2. Create User Document
        const userRef = doc(db, "users", user.uid);
        await setDoc(userRef, {
          uid: user.uid,
          email: user.email,
          fullName: user.displayName || "OpsReveal User",
          provider: user.providerData[0]?.providerId || 'password',
          role: userRole,
          companyId: targetCompanyId,
          invitedBy: invitedBy || null,
          plan: "starter",
          status: "active",
          onboardingCompleted: true,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        }, { merge: true });

      } catch (err) {
        console.warn("Profile pre-creation notice: auth-guard will complete profile setup on login.", err);
      }
    }

    // Form Submission
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.classList.add('hidden');

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (password.length < 8 || !/[A-Z]/.test(password) || !/[\d\W]/.test(password)) {
        showError("Please satisfy all password conditions (8+ chars, 1 uppercase, 1 number/symbol).");
        return;
      }

      if (password !== confirmPassword) {
        showError("Passwords do not match.");
        return;
      }

      setLoading(true);

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        await syncMinimalUserProfile(user);

        // If invited, bypass verification redirect and send straight to dashboard
        if (invitedBy) {
          window.location.href = '/app/dashboard';
        } else {
          await sendEmailVerification(user);
          window.location.href = '/verify-email.html';
        }

      } catch (err) {
        setLoading(false);
        showError(err.message.replace('Firebase: ', ''));
      }
    });

    // Google Sign-Up Handler
    googleAuthBtn.addEventListener('click', async () => {
      errorBanner.classList.add('hidden');
      const provider = new GoogleAuthProvider();

      try {
        const result = await signInWithPopup(auth, provider);
        await syncMinimalUserProfile(result.user);
        window.location.href = '/app/dashboard';
      } catch (err) {
        showError(err.message.replace('Firebase: ', ''));
      }
    });
  </script>
