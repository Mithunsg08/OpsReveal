<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpsReveal | Log In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="h-12 w-12 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-black text-slate-950 text-xl mx-auto">O</div>
      <h1 class="text-2xl font-bold text-white">Welcome back</h1>
      <p class="text-xs text-slate-400">Log in to view your operational leakage metrics.</p>
    </div>

    <!-- Status Message Box -->
    <div id="msg-box" class="hidden p-4 rounded-xl text-xs font-semibold"></div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleEmailLogin(event)" class="space-y-4 text-xs">
      <div>
        <label class="block mb-1 font-medium text-slate-300">Work Email</label>
        <input type="email" id="login-email" required placeholder="name@company.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
      </div>
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="font-medium text-slate-300">Password</label>
          <button type="button" onclick="handlePasswordReset()" class="text-[11px] text-cyan-400 hover:underline">Forgot Password?</button>
        </div>
        <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
      </div>
      
      <button type="submit" id="btn-login" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl transition">
        Log In
      </button>
    </form>

    <div class="relative flex items-center justify-center my-4">
      <div class="border-t border-slate-800 w-full"></div>
      <span class="bg-slate-900 px-3 text-[10px] text-slate-500 uppercase font-semibold absolute">Or continue with</span>
    </div>

    <!-- Google Login -->
    <button onclick="handleGoogleAuth()" class="w-full bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 font-semibold py-3 rounded-xl text-xs flex items-center justify-center space-x-2 transition">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Log in with Google</span>
    </button>

    <!-- Footer -->
    <p class="text-center text-xs text-slate-400 pt-2">
      Don't have an account? <a href="/signup.html" class="text-cyan-400 font-semibold hover:underline">Sign Up</a>
    </p>
  </div>

  <script type="module">
    import { auth, ensureUserProfile } from '/app/auth-guard.js';
    import { 
      signInWithEmailAndPassword, 
      sendPasswordResetEmail, 
      GoogleAuthProvider, 
      signInWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    window.handleEmailLogin = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login');

      try {
        btn.disabled = true;
        btn.innerText = "Authenticating...";

        const cred = await signInWithEmailAndPassword(auth, email, password);

        // ISSUE 1 & ISSUE 2 FIX: Check verification status for password signups
        if (!cred.user.emailVerified) {
          showMsg("Your email address is not verified yet. Please check your inbox for the link.", "error");
          btn.disabled = false;
          btn.innerText = "Log In";
          return;
        }

        await ensureUserProfile(cred.user);
        window.location.href = '/app/dashboard.html';
      } catch (err) {
        showMsg(err.message, "error");
        btn.disabled = false;
        btn.innerText = "Log In";
      }
    };

    window.handlePasswordReset = async () => {
      const email = document.getElementById('login-email').value;
      if (!email) {
        showMsg("Please enter your email address above to receive a password reset link.", "error");
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        showMsg(`Password reset email sent to ${email}. Check your inbox.`, "success");
      } catch (err) {
        showMsg(err.message, "error");
      }
    };

    window.handleGoogleAuth = async () => {
      try {
        const provider = new GoogleAuthProvider();
        const cred = await signInWithPopup(auth, provider);
        await ensureUserProfile(cred.user);
        window.location.href = '/app/dashboard.html';
      } catch (err) {
        showMsg(err.message, "error");
      }
    };

    function showMsg(msg, type) {
      const box = document.getElementById('msg-box');
      box.innerText = msg;
      box.className = `p-4 rounded-xl text-xs font-semibold ${type === 'success' ? 'bg-emerald-950/80 border border-emerald-800 text-emerald-300' : 'bg-rose-950/80 border border-rose-800 text-rose-300'}`;
      box.classList.remove('hidden');
    }
  </script>
</body>
</html>
