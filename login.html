<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpsReveal - Log In</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4, .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
    .bg-grid { 
      background-image: radial-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px); 
      background-size: 32px 32px; 
    }
  </style>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0284c7',
              900: '#0c4a6e',
              950: '#082f49',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen text-slate-100 bg-slate-950 flex flex-col justify-center bg-grid font-sans antialiased py-12 px-4 sm:px-6 lg:px-8">

  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <!-- Brand Logo -->
    <div class="flex justify-center">
      <div class="h-12 w-12 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-extrabold text-2xl text-slate-950 shadow-lg shadow-cyan-500/20">
        O
      </div>
    </div>
    <h2 class="mt-4 text-center text-3xl font-extrabold text-white font-heading tracking-tight">Log in to OpsReveal</h2>
    <p class="mt-2 text-center text-xs text-slate-400">Access your operational auditing portal</p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-slate-900 border border-slate-800 py-8 px-4 shadow-2xl rounded-2xl sm:px-10">

      <!-- Error / Warning Banner -->
      <div id="errorBanner" class="hidden mb-6 bg-red-950/60 border border-red-800/80 rounded-xl p-4 text-red-200 text-xs flex items-start space-x-3">
        <svg class="w-5 h-5 text-red-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <div>
          <h4 class="font-bold text-red-400 mb-0.5">Authentication Error</h4>
          <p id="errorMessage">Invalid email or password.</p>
        </div>
      </div>

      <!-- Google Sign-In Button -->
      <div>
        <button id="googleAuthBtn" type="button" class="w-full flex justify-center items-center py-2.5 px-4 border border-slate-700/80 rounded-xl shadow-sm bg-slate-950 text-xs font-semibold text-slate-200 hover:bg-slate-800 focus:outline-none transition space-x-3">
          <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
            <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9z"/>
            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
      </div>

      <div class="mt-6 relative">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-800"></div>
        </div>
        <div class="relative flex justify-center text-xs uppercase">
          <span class="bg-slate-900 px-3 text-slate-500 font-semibold">Or log in with email</span>
        </div>
      </div>

      <!-- Native form submissions prevented -->
      <form id="loginForm" action="javascript:void(0);" onsubmit="return false;" class="mt-6 space-y-4">
        <div>
          <label for="email" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="name@company.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:border-cyan-500 focus:outline-none transition">
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Password</label>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-4 pr-10 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:border-cyan-500 focus:outline-none transition">
            <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-300">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <button id="submitBtn" type="button" class="w-full flex justify-center items-center py-3 px-4 rounded-xl shadow-lg shadow-cyan-500/20 text-xs font-bold text-slate-950 bg-cyan-400 hover:bg-cyan-300 focus:outline-none transition font-heading uppercase tracking-wider mt-2">
          <span id="btnText">Log In</span>
          <div id="btnSpinner" class="hidden w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></div>
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-xs text-slate-400">
          Don't have an account? 
          <a href="/signup.html" class="font-bold text-cyan-400 hover:underline">Sign up</a>
        </p>
      </div>

    </div>
  </div>

  <!-- Inline event safeguard -->
  <script>
    document.getElementById('submitBtn').onclick = function(e) {
      e.preventDefault();
      if (window.executeEmailLogin) {
        window.executeEmailLogin();
      } else {
        alert("Firebase scripts are loading. Please try again in a moment.");
      }
    };
  </script>

  <!-- Firebase Authentication Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      signOut,
      GoogleAuthProvider, 
      signInWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANvecmxTQfsum_1NThmFFVELCe3dlNm6g",
      authDomain: "opsreveal.firebaseapp.com",
      projectId: "opsreveal",
      storageBucket: "opsreveal.firebasestorage.app",
      messagingSenderId: "890870101711",
      appId: "1:890870101711:web:4266246996091ea56c69ba"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const googleAuthBtn = document.getElementById('googleAuthBtn');
    const errorBanner = document.getElementById('errorBanner');
    const errorMessage = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    if (togglePasswordBtn) {
      togglePasswordBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
      });
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      errorBanner.classList.remove('hidden');
    }

    function setLoading(isLoading) {
      if (isLoading) {
        submitBtn.disabled = true;
        btnText.classList.add('hidden');
        btnSpinner.classList.remove('hidden');
      } else {
        submitBtn.disabled = false;
        btnText.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
      }
    }

    async function ensureUserDocExists(user) {
      try {
        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);

        if (!snap.exists()) {
          await setDoc(userRef, {
            uid: user.uid,
            email: user.email,
            provider: user.providerData[0]?.providerId || 'password',
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
        }
      } catch (fsErr) {
        console.warn("Firestore sync non-fatal error:", fsErr);
      }
    }

    window.executeEmailLogin = async function() {
      errorBanner.classList.add('hidden');

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError("Please enter both email address and password.");
        return;
      }

      setLoading(true);

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        try {
          await user.reload();
        } catch (rErr) {
          console.warn("Reload warning:", rErr);
        }

        if (!auth.currentUser.emailVerified) {
          await signOut(auth);
          setLoading(false);
          showError("Your email is not verified yet. Check your inbox and click the verification link.");
          return;
        }

        await ensureUserDocExists(auth.currentUser);

        // Redirecting to nested directory structure
        window.location.href = '/app/dashboard/';

      } catch (err) {
        console.error("Login Exception:", err);
        setLoading(false);

        let cleanMsg = err.message.replace('Firebase: ', '');
        if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
          cleanMsg = "Invalid email or password.";
        } else if (err.code === 'auth/too-many-requests') {
          cleanMsg = "Account locked due to multiple failed attempts. Try again later.";
        }
        showError(cleanMsg);
      }
    };

    googleAuthBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      errorBanner.classList.add('hidden');
      const provider = new GoogleAuthProvider();

      try {
        const result = await signInWithPopup(auth, provider);
        await ensureUserDocExists(result.user);
        window.location.href = '/app/dashboard/';
      } catch (err) {
        console.error("Google Auth Exception:", err);
        showError(err.message.replace('Firebase: ', ''));
      }
    });
  </script>
</body>
</html>
