<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpsReveal - Log In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen text-slate-100 bg-slate-950 flex flex-col justify-center items-center px-4">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
    <div class="text-center">
      <h2 class="text-2xl font-bold text-white font-heading">Log in to OpsReveal</h2>
      <p class="text-xs text-slate-400 mt-1">Operational Auditing Portal</p>
    </div>

    <!-- Error Banner -->
    <div id="errorBanner" class="hidden p-3 rounded-xl bg-red-950/80 border border-red-800 text-red-200 text-xs">
      <p id="errorMessage">An error occurred.</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Email</label>
        <input id="email" type="email" required placeholder="name@company.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Password</label>
        <input id="password" type="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
      </div>

      <button id="submitBtn" type="submit" class="w-full py-3 px-4 rounded-xl font-bold text-xs text-slate-950 bg-cyan-400 hover:bg-cyan-300 transition uppercase">
        Log In
      </button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANvecmxTQfsum_1NThmFFVELCe3dlNm6g",
      authDomain: "opsreveal.firebaseapp.com",
      projectId: "opsreveal",
      storageBucket: "opsreveal.firebasestorage.app",
      messagingSenderId: "890870101711",
      appId: "1:890870101711:web:4266246996091ea56c69ba"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById('loginForm');
    const errorBanner = document.getElementById('errorBanner');
    const errorMessage = document.getElementById('errorMessage');

    async function handleLogin() {
      errorBanner.classList.add('hidden');
      console.log("=== LOGIN PROCESS STARTED ===");

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        errorMessage.textContent = "Please enter both email and password.";
        errorBanner.classList.remove('hidden');
        return;
      }

      try {
        console.log("Attempting Firebase Authentication for:", email);
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        console.log("Auth Successful! UID:", userCredential.user.uid);

        // Force-refresh status check for email verification
        await userCredential.user.reload();
        console.log("Email Verified Status:", auth.currentUser.emailVerified);

        if (!auth.currentUser.emailVerified) {
          console.warn("User is unverified. Signing out...");
          await signOut(auth);
          errorMessage.textContent = "Your email address is not verified yet. Please check your inbox and click the verification link.";
          errorBanner.classList.remove('hidden');
          return;
        }

        console.log("Redirecting to dashboard...");
        window.location.href = '/dashboard.html';

      } catch (err) {
        console.error("Firebase Login Error:", err);
        let msg = err.message.replace('Firebase: ', '');
        if (err.code === 'auth/invalid-credential') {
          msg = "Invalid email or password.";
        }
        errorMessage.textContent = msg;
        errorBanner.classList.remove('hidden');
      }
    }

    // Attach event directly to form submit
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      handleLogin();
    });
  </script>
</body>
</html>
