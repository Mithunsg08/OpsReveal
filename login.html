<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpsReveal | Log In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="h-12 w-12 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-black text-slate-950 text-xl mx-auto">O</div>
      <h1 class="text-2xl font-bold text-white">Welcome Back</h1>
      <p class="text-xs text-slate-400">Login to OpsReveal</p>
    </div>

    <!-- Error/Status Box -->
    <div id="error-box" class="hidden p-4 rounded-xl text-xs font-semibold bg-rose-950/80 border border-rose-800 text-rose-300"></div>

    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-xs">
      <div>
        <label class="block mb-1 font-medium text-slate-300">Work Email</label>
        <input type="email" id="email" required placeholder="name@company.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-cyan-500">
      </div>

      <div>
        <label class="block mb-1 font-medium text-slate-300">Password</label>
        <div class="relative">
          <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 pr-10 text-white focus:outline-none focus:border-cyan-500">
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
            <span id="eye-icon">👁️</span>
          </button>
        </div>
      </div>
      
      <button type="submit" id="btn-login" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl transition">
        Login
      </button>
    </form>

    <div class="relative flex items-center justify-center my-4">
      <div class="border-t border-slate-800 w-full"></div>
      <span class="bg-slate-900 px-3 text-[10px] text-slate-500 uppercase font-semibold absolute">Or continue with</span>
    </div>

    <button onclick="handleGoogleLogin()" class="w-full bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 font-semibold py-3 rounded-xl text-xs flex items-center justify-center space-x-2 transition">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <p class="text-center text-xs text-slate-400 pt-2">
      Don't have an account? <a href="/signup.html" class="text-cyan-400 font-semibold hover:underline">Create account</a>
    </p>
  </div>

  <script type="module">
    import { auth, db } from '/app/auth-guard.js';
    import { 
      signInWithEmailAndPassword, 
      sendEmailVerification, 
      GoogleAuthProvider, 
      signInWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Password Eye Toggle
    window.togglePasswordVisibility = () => {
      const pwdInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.innerText = '🙈';
      } else {
        pwdInput.type = 'password';
        eyeIcon.innerText = '👁️';
      }
    };

    // Email/Password Login Function
    window.handleLogin = async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');

      try {
        btn.disabled = true;
        btn.innerText = "Signing in...";
        hideError();

        const result = await signInWithEmailAndPassword(auth, email, password);
        await result.user.reload();

        // 1. Email Verification Check
        if (!result.user.emailVerified) {
          await sendEmailVerification(result.user, {
            url: `${window.location.origin}/login.html`
          });
          showError("Your email is not verified. We sent another verification email to your inbox.");
          return;
        }

        // 2. Firestore User Profile Check
        const userDoc = await getDoc(doc(db, "users", result.user.uid));
        if (!userDoc.exists()) {
          showError("User profile not found. Please sign up first.");
          return;
        }

        // 3. Successful Navigation
        window.location.href = '/app/dashboard.html';
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Login";
      }
    };

    // Google Login Function
    window.handleGoogleLogin = async () => {
      try {
        hideError();
        const provider = new GoogleAuthProvider();
        const result = await signInWithPopup(auth, provider);

        const userRef = doc(db, "users", result.user.uid);
        const existingUser = await getDoc(userRef);

        if (!existingUser.exists()) {
          window.location.href = '/signup.html';
          return;
        }

        window.location.href = '/app/dashboard.html';
      } catch (err) {
        showError(err.message);
      }
    };

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.innerText = msg;
      box.classList.remove('hidden');
    }

    function hideError() {
      const box = document.getElementById('error-box');
      box.classList.add('hidden');
    }
  </script>
</body>
</html>
