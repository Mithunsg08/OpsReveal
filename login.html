<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpsReveal | Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 space-y-6 shadow-2xl">
    <div class="text-center space-y-2">
      <div class="h-12 w-12 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-black text-slate-950 text-xl mx-auto">O</div>
      <h1 class="text-2xl font-bold text-white">Welcome back</h1>
      <p class="text-xs text-slate-400">Sign in to your OpsReveal account</p>
    </div>

    <button onclick="handleGoogleLogin()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-3 px-4 rounded-xl border border-slate-700 flex items-center justify-center space-x-3 transition">
      <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.1 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12s.7 2.3 1.9 4.7l3.7-1.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.1-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/></svg>
      <span class="text-sm">Continue with Google</span>
    </button>

    <div class="flex items-center space-x-3 my-4">
      <div class="h-px bg-slate-800 flex-1"></div>
      <span class="text-[11px] text-slate-500 font-semibold uppercase">Or email</span>
      <div class="h-px bg-slate-800 flex-1"></div>
    </div>

    <form id="loginForm" onsubmit="handleEmailLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Work Email</label>
        <input type="email" id="loginEmail" required placeholder="name@company.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-500">
      </div>

      <div id="loginError" class="hidden text-xs text-rose-400 bg-rose-950/50 border border-rose-800 p-3 rounded-xl"></div>

      <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3.5 rounded-xl transition">
        Sign In
      </button>
    </form>

    <p class="text-center text-xs text-slate-400">
      Don't have an account? <a href="/signup" class="text-cyan-400 hover:underline font-semibold">Sign Up</a>
    </p>
  </div>

  <script type="module">
    import { auth, ensureUserProfile } from '/app/auth-guard.js';
    import { 
      signInWithEmailAndPassword, 
      GoogleAuthProvider, 
      signInWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    window.handleGoogleLogin = async () => {
      const provider = new GoogleAuthProvider();
      try {
        const res = await signInWithPopup(auth, provider);
        await ensureUserProfile(res.user);
        window.location.href = '/app/dashboard';
      } catch (err) {
        showError(err.message);
      }
    };

    window.handleEmailLogin = async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await signInWithEmailAndPassword(auth, email, password);
        if (!res.user.emailVerified) {
          showError("Your email is not verified yet. Please check your inbox.");
          return;
        }
        await ensureUserProfile(res.user);
        window.location.href = '/app/dashboard';
      } catch (err) {
        showError(err.message);
      }
    };

    function showError(msg) {
      const errBox = document.getElementById('loginError');
      errBox.innerText = msg;
      errBox.classList.remove('hidden');
    }
  </script>
</body>
</html>
