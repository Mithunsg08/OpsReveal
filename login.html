<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpsReveal - Log In</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen text-slate-100 bg-slate-950 flex flex-col justify-center items-center p-6">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl">
    <h2 class="text-2xl font-bold mb-6 text-center text-white">Log in to OpsReveal</h2>

    <!-- Error Banner -->
    <div id="errorBanner" class="hidden mb-4 bg-red-950 border border-red-800 p-3 rounded-lg text-red-200 text-xs">
      <p id="errorMessage"></p>
    </div>

    <!-- Inputs (NOT wrapped in a form tag) -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">Email</label>
        <input id="email" type="email" placeholder="name@company.com" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white">
      </div>

      <div>
        <label class="block text-xs uppercase text-slate-400 mb-1">Password</label>
        <input id="password" type="password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-white">
      </div>

      <button id="submitBtn" type="button" class="w-full py-3 bg-cyan-400 text-slate-950 font-bold rounded-lg uppercase tracking-wider">
        Log In
      </button>

      <button id="googleAuthBtn" type="button" class="w-full py-3 bg-slate-800 text-white font-semibold rounded-lg mt-2">
        Continue with Google
      </button>
    </div>
  </div>

  <script type="module">
    console.log("=== DIAGNOSTIC SCRIPT INITIALIZED ===");

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      signOut,
      GoogleAuthProvider, 
      signInWithPopup 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyANvecmxTQfsum_1NThmFFVELCe3dlNm6g",
      authDomain: "opsreveal.firebaseapp.com",
      projectId: "opsreveal",
      storageBucket: "opsreveal.firebasestorage.app",
      messagingSenderId: "890870101711",
      appId: "1:890870101711:web:4266246996091ea56c69ba"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const googleAuthBtn = document.getElementById('googleAuthBtn');
    const errorBanner = document.getElementById('errorBanner');
    const errorMessage = document.getElementById('errorMessage');

    function showError(msg) {
      console.error("UI Error Displayed:", msg);
      errorMessage.textContent = msg;
      errorBanner.classList.remove('hidden');
    }

    submitBtn.addEventListener('click', async () => {
      console.log("--> Submit Button Clicked!");
      errorBanner.classList.add('hidden');

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError("Please enter email and password.");
        return;
      }

      try {
        console.log("Sending auth request to Firebase for:", email);
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        console.log("Firebase Auth Success! UID:", userCredential.user.uid);

        await userCredential.user.reload();

        if (!auth.currentUser.emailVerified) {
          console.warn("User email not verified.");
          await signOut(auth);
          showError("Email unverified. Please check your inbox.");
          return;
        }

        console.log("Redirecting to dashboard...");
        window.location.href = './dashboard.html';

      } catch (err) {
        console.error("Firebase Login Error Catch:", err);
        showError(err.code + " : " + err.message);
      }
    });

    googleAuthBtn.addEventListener('click', async () => {
      console.log("--> Google Button Clicked!");
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(auth, provider);
        console.log("Google Login Success!", result.user.email);
        window.location.href = './dashboard.html';
      } catch (err) {
        console.error("Google Login Error:", err);
        showError(err.message);
      }
    });
  </script>
</body>
</html>
